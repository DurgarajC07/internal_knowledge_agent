# Local dev / integration-test infrastructure only — never used in production
# (Plan.md: Qdrant Cloud free tier for MVP prod; this is the $0 local loop).
#
# Usage: docker compose -f infrastructure/docker/docker-compose.yml up -d
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: knowledge_agent
      POSTGRES_PASSWORD: knowledge_agent
      POSTGRES_DB: knowledge_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  qdrant_data:
  postgres_data:
