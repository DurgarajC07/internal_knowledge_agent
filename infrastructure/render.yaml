# Render Blueprint for the FastAPI backend (apps/api).
# Free tier is fine for a demo/pilot; switch `plan` to `starter` the moment a
# real customer relies on this daily (Plan.md SS10 — free web services spin
# down after 15 min idle with a 30-60s cold start).
services:
  - type: web
    name: knowledge-agent-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install uv && uv sync --frozen"
    startCommand: "uv run alembic upgrade head && uv run uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: hosted
      - key: DATABASE_URL
        fromDatabase:
          name: knowledge-agent-db
          property: connectionString
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: HOSTED_LLM_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_ID
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_SECRET
        sync: false
      - key: NOTION_CLIENT_ID
        sync: false
      - key: NOTION_CLIENT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: '["https://<your-vercel-app>.vercel.app"]'

databases:
  - name: knowledge-agent-db
    plan: free
    region: oregon
    # NOTE (Plan.md SS10): Render's free Postgres expires ~30 days after
    # creation. Budget for a paid tier before onboarding a real customer.
