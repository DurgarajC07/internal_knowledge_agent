[project]
name = "knowledge-agent"
version = "0.1.0"
description = "Multi-tenant B2B internal knowledge agent (RAG + MCP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "qdrant-client>=1.10",
    "pypdf>=4.3",
    "cryptography>=43.0",
    "pyjwt>=2.9",
    "mcp>=1.2",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "structlog>=24.4",
    "email-validator>=2.2",
    "passlib[argon2]>=1.7",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.pyright]
include = ["apps", "services", "packages", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=services --cov=packages.core --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
# Rule.md SS9: "Minimum coverage gate: 80% on services/ and packages/core" —
# packages/clients and packages/config are infra glue exercised mostly via
# integration tests, not held to this unit-level gate.
source = ["services", "packages/core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "services", "packages"]
